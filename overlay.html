<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crosshair Studio X Overlay</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        user-select: none;
        pointer-events: none;
      }
      #overlay-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="overlay-canvas"></canvas>
    <script type="module" src="/src/overlay/overlayMain.ts"></script>
  </body>
</html>
