name: Build & Auto-Update Release (Commits + Releases)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Version & Release Channel
        shell: pwsh
        run: |
          $pkgPath = "package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $baseVer = ($pkg.version -split '-')[0]
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVer = $env:GITHUB_REF_NAME -replace '^v', ''
            $pkg.version = $tagVer
            $pkg.build.publish.releaseType = "release"
            Write-Host "Publishing STABLE GitHub Release v$tagVer"
          } else {
            $commitVer = "$baseVer-commit.$($env:GITHUB_RUN_NUMBER)"
            $pkg.version = $commitVer
            $pkg.build.publish.releaseType = "prerelease"
            Write-Host "Publishing COMMIT Auto-Update Pre-Release v$commitVer"
          }
          $pkg | ConvertTo-Json -Depth 12 | Set-Content $pkgPath -Encoding UTF8

      - name: Build Self-Contained WinBridge, Electron & Studio UI
        run: npm run build:prod

      - name: Package & Publish Windows Installer + Portable + Auto-Update Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
