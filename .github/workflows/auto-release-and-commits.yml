name: Build & Auto-Update Release (Commits + Releases)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dependencies
        run: npm ci

      - name: Compute Version (Tag Release vs Rolling Commit Pre-Release)
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $baseVer = $pkg.version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVer = $env:GITHUB_REF_NAME -replace '^v', ''
            echo "version=$tagVer" >> $env:GITHUB_OUTPUT
            echo "prerelease=false" >> $env:GITHUB_OUTPUT
            echo "release_type=release" >> $env:GITHUB_OUTPUT
          } else {
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            $commitVer = "$baseVer-commit.$($env:GITHUB_RUN_NUMBER)"
            npm version $commitVer --no-git-tag-version --allow-same-version
            echo "version=$commitVer" >> $env:GITHUB_OUTPUT
            echo "prerelease=true" >> $env:GITHUB_OUTPUT
            echo "release_type=prerelease" >> $env:GITHUB_OUTPUT
          }

      - name: Build Self-Contained WinBridge, Electron & Studio UI
        run: npm run build:prod

      - name: Package & Publish Windows Installer + Portable + Auto-Update Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always -c.publish.releaseType=${{ steps.ver.outputs.release_type }}
